name: Deploy Market OS to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          # Ensure Stripe is installed
          pip install stripe

      - name: Build React frontend
        run: |
          cd frontend
          npm install
          npm run build
          # Verify build output exists
          ls -la dist/

      - name: Copy frontend build into backend static folder
        run: |
          mkdir -p backend/static
          cp -r frontend/dist/* backend/static/

      - name: Create deployment package
        run: |
          zip -r deploy.zip backend/ startup.sh -x "backend/venv/*" -x "backend/__pycache__/*" -x "backend/**/__pycache__/*"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Market-OS'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy.zip
